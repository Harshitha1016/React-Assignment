<!DOCTYPE html>
<html>
<head>

    <title>User Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <h2>User Login</h2>

    <input type="text"
           id="username"
           placeholder="Enter Username">

    <input type="password"
           id="password"
           placeholder="Enter Password">

    <button onclick="login()">Login</button>

    <p id="message"></p>

    <p>
        New User?
        <a href="register.html">Register</a>
    </p>

</div>

<script src="script.js"></script>

</body>
</html>
